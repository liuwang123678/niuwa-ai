name: flutter_secure_storage_windows
description: Windows implementation of flutter_secure_storage. Please use flutter_secure_storage instead of this package.
repository: https://github.com/mogol/flutter_secure_storage
version: 4.2.2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2
  win32: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_windows: ^2.0.0
  very_good_analysis: ^7.0.0

flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      windows:
        # ⚠️ 本地改动：上游这里还有一行
        #     pluginClass: FlutterSecureStorageWindowsPlugin
        #   已删除，`windows/` 目录也一并删了。原因见 README-VENDORED.md。
        #   保留 dartPluginClass 就够——下面那个 Dart 类
        #   （lib/src/flutter_secure_storage_windows_ffi.dart）直接走
        #   ffi + win32 调 DPAPI，不经过 method channel。
        dartPluginClass: FlutterSecureStorageWindows
